[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=7A3F1C2E4B5D4E6F8A9B0C1D2E3F4A5B
ProjectName=Aquarium

[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysCook=(Path="/Game/UI")

; OFL 1.1 (section 2) requires the licence text to travel with any redistributed
; copy of the font. Until M6 nothing was staged: verify_package.sh's font-licence
; check was FAIL for both configurations. Content/Licenses holds no .uasset, so it
; must be staged as NonUFS -- the cooker would otherwise skip a plain .txt.
+DirectoriesToAlwaysStageAsNonUFS=(Path="Licenses")

; Game Feature plugins (enabled by engine plugins we depend on) require an Asset
; Manager rule for GameFeatureData. Without it the cook COMPLETES but the
; commandlet exits 1 on "Asset manager settings do not include a rule for assets
; of type GameFeatureData", which fails RunUAT with Error_UnknownCookFailure.
; This is the same unrelated error that has forced every editor Python run in
; this project to be judged by grepping for *_OK instead of by exit code.
; bIsEditorOnly=True is required: GameFeatures is not linked into the packaged
; game, so a runtime rule ensures on AssetBaseClassLoaded at startup.
; Directories points at an empty path on purpose -- the project ships no
; GameFeatureData assets; the rule exists only to satisfy the validator.
[/Script/Engine.AssetManagerSettings]
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass="/Script/GameFeatures.GameFeatureData",bHasBlueprintClasses=False,bIsEditorOnly=True,Directories=((Path="/Game/Unused")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=Unknown))
